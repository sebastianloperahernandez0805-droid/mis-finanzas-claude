name: Compilar app iOS

# Se ejecuta solo cuando tú lo pides (pestaña Actions ▸ "Compilar app iOS" ▸ Run workflow)
# y también cada vez que subes cambios a la rama main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  compilar:
    # Máquina Mac que presta GitHub; trae Xcode instalado. Se usa la versión Intel porque las
    # Mac con chip Apple (macos-latest) se quedan sin cupo a ratos y el trabajo se cancela sin compilar.
    # Es la imagen con macOS 26, que trae Xcode 26: compilar con Xcode 26 es lo que activa el
    # diseño Liquid Glass del sistema (barra de pestañas, barras superiores, hojas) en iOS 26.
    runs-on: macos-26-intel
    timeout-minutes: 40

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Elegir la versión más nueva de Xcode 26
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi

      - name: Mostrar versión de Xcode
        run: |
          xcodebuild -version
          echo "::notice title=Xcode usado::$(xcodebuild -version | tr '\n' ' ')"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        run: xcodegen generate

      - name: Compilar para iPhone (sin firmar)
        run: |
          set -o pipefail
          xcodebuild \
            -project MisFinanzas.xcodeproj \
            -scheme MisFinanzas \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Crear el archivo .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MisFinanzas.app Payload/
          zip -qry MisFinanzas.ipa Payload

      - name: Guardar el .ipa para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: MisFinanzas-ipa
          path: MisFinanzas.ipa

      - name: Resumir los errores de compilación (si algo falla)
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -10 | while IFS= read -r linea; do
            echo "::error::${linea}"
          done || true

      - name: Guardar el registro de compilación (si algo falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro-de-compilacion
          path: build.log
