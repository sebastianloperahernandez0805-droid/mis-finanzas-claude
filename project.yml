# Definición del proyecto para XcodeGen.
# Sirve para que GitHub genere el archivo .xcodeproj por ti (no necesitas Xcode ni Mac).
# Si algún día usas un Mac, puedes borrar este archivo y abrir el proyecto con `xcodegen generate`
# o crear el proyecto a mano siguiendo GUIA_XCODE.md.

name: MisFinanzas

options:
  bundleIdPrefix: com.sebastian
  deploymentTarget:
    iOS: "17.0"

targets:
  MisFinanzas:
    type: application
    platform: iOS
    sources:
      - path: MisFinanzas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastian.misfinanzas
        PRODUCT_NAME: MisFinanzas
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"                 # modo Swift 5: evita errores estrictos de concurrencia de Swift 6
        TARGETED_DEVICE_FAMILY: "1"          # 1 = solo iPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Mis Finanzas"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
